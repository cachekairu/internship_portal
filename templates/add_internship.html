{% extends "base.html" %}
{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <h2>Add Internship Details</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Company Name</label>
            <input type="text" name="company_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Required Hours</label>
            <input type="number" step="any" name="required_hours" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Adviser</label>
            <select name="adviser_id" class="form-control" required>
                {% for adviser in advisers %}
                <option value="{{ adviser.id }}">{{ adviser.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save Internship</button>
    </form>
</div>
{% endblock %}
