{% extends "base.html" %}
{% block title %}Add New User - Admin Panel{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card p-4 bg-white border-0 shadow-sm">
            <h3 class="fw-bold text-dark mb-4">Add New User</h3>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-medium small text-secondary">Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small text-secondary">Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small text-secondary">Student Number (Opsyonal para sa Student)</label>
                    <input type="text" name="student_number" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small text-secondary">Course (Para sa Student)</label>
                    <input type="text" name="course" class="form-control" placeholder="e.g. BSIT, BSIS">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small text-secondary">Role</label>
                    <select name="role" class="form-select" required>
                        <option value="student">Student</option>
                        <option value="adviser">Adviser</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium small text-secondary">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary px-4">Kanselahin</a>
                    <button type="submit" class="btn btn-success px-4">I-save ang Bagong User</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
