{% extends "base.html" %}
{% block title %}Edit User - Admin Panel{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card p-4 bg-white border-0 shadow-sm">
            <h3 class="fw-bold text-dark mb-4">Edit User: {{ target_user.name }}</h3>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-medium small text-secondary">Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ target_user.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small text-secondary">Email Address</label>
                    <input type="email" name="email" class="form-control" value="{{ target_user.email }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small text-secondary">Student Number</label>
                    <input type="text" name="student_number" class="form-control" value="{{ target_user.student_number or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small text-secondary">Course</label>
                    <input type="text" name="course" class="form-control" value="{{ target_user.course or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small text-secondary">Role</label>
                    <select name="role" class="form-select" required>
                        <option value="student" {% if target_user.role == 'student' %}selected{% endif %}>Student</option>
                        <option value="adviser" {% if target_user.role == 'adviser' %}selected{% endif %}>Adviser</option>
                        <option value="admin" {% if target_user.role == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium small text-secondary">New Password (Opsyonal)</label>
                    <input type="password" name="password" class="form-control" placeholder="I-leave it blank kung di mo babaguhin">
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary px-4">Kanselahin</a>
                    <button type="submit" class="btn btn-primary px-4">I-save ang Pagbabago</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
